name: "KiCAD CI/CD for dev-factory"

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  generate-outputs:
    strategy:
      matrix:
        board:
          # - xdevrf01
          # - xdevrf02
          - xdevrf03
          - xdevstm01
          - xdevrpi01
          - brkcan01

    name: "KiCAD outputs for ${{ matrix.board }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: git submodule update --init --recursive
      - uses: INTI-CMNB/KiBot@v2_k8
        with:
          config: ${{ matrix.board }}/${{ matrix.board }}.kibot.yaml
          dir: ${{ matrix.board }}-outputs
          schema: '${{ matrix.board }}/${{ matrix.board }}.kicad_sch'
          board: '${{ matrix.board }}/${{ matrix.board }}.kicad_pcb'
          verbose: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          path: ${{ matrix.board }}-outputs

  build-pages:
    name: Build Pages Artifacts
    runs-on: ubuntu-latest
    needs: [generate-outputs]

    steps:
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: 'latest'
      - run: cargo install --git https://github.com/nnarain/mdbook-file-search
      - uses: actions/download-artifact@v4
        with:
          path: build
      - run: cd docs && mdbook build
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/

  deploy:
    name: Deploy to Github Pages
    runs-on: ubuntu-latest
    needs: [build-pages]

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
